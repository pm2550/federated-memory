# ── HTTPS endpoint (7443) ────────────────────────────────────────────────
server {
    listen 7443 ssl;
    server_name _;

    ssl_certificate     /etc/ssl/mcp/cert.pem;
    ssl_certificate_key /etc/ssl/mcp/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    server_tokens off;

    # Anti-scan: no auth header → close connection, no fingerprint
    if ($http_authorization = "") {
        return 444;
    }

    limit_req  zone=mcp_req  burst=20 nodelay;
    limit_conn mcp_conn 10;
    client_max_body_size 400M;

    access_log /var/log/nginx/mcp-access.log;
    error_log  /var/log/nginx/mcp-error.log warn;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Connection  "";
        proxy_set_header   Host        $host;
        proxy_set_header   X-Real-IP   $remote_addr;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }
}

# ── HTTP endpoint (7444) ─────────────────────────────────────────────────
# Plain HTTP for clients that can't trust self-signed certs (e.g. Claude/Codex CLI).
# Bearer token + anti-scan still apply. Token travels in plaintext over this port;
# acceptable for home/office networks but not hostile ones.
server {
    listen 7444;
    server_name _;

    server_tokens off;

    if ($http_authorization = "") {
        return 444;
    }

    limit_req  zone=mcp_req  burst=20 nodelay;
    limit_conn mcp_conn 10;
    client_max_body_size 400M;

    access_log /var/log/nginx/mcp-access.log;
    error_log  /var/log/nginx/mcp-error.log warn;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Connection  "";
        proxy_set_header   Host        $host;
        proxy_set_header   X-Real-IP   $remote_addr;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
